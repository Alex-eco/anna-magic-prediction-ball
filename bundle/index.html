<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Magic Prediction Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Magic Prediction Ball</h1>
    <p class="hint">Ask a question. Tap the ball for an answer.</p>
    <div class="ball" id="ball" role="button" tabindex="0" aria-label="Tap the prediction ball">
      <div class="window"><div class="answer" id="answer">TAP ME</div></div>
    </div>
    <button id="ask" type="button">Ask the Ball</button>
    <div class="history" id="history" aria-live="polite"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
