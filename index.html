<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Prediction Ball</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#26345a,#0b1020 65%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.app{text-align:center;width:min(620px,92vw)}h1{margin:0 0 8px;font-size:34px}.hint{margin:0 0 30px;color:#b9c3df}.ball{width:330px;height:330px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#59627d,#202638 48%,#080b12 75%);box-shadow:0 25px 70px #0008,inset -25px -30px 50px #0008,inset 12px 12px 35px #ffffff18;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .18s}.ball:hover{transform:scale(1.025)}.ball.shake{animation:shake .65s ease}.window{width:150px;height:150px;border-radius:50%;background:#080b12;display:flex;align-items:center;justify-content:center;padding:24px;box-shadow:inset 0 0 25px #000}.answer{font-weight:700;font-size:18px;line-height:1.25}.triangle{display:none}button{margin-top:28px;border:0;border-radius:999px;padding:13px 26px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#121827}button:hover{transform:translateY(-1px)}.history{margin-top:24px;color:#9da9c9;font-size:13px;min-height:20px}@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg) scale(1.03)}40%{transform:rotate(7deg) scale(1.03)}60%{transform:rotate(-5deg) scale(1.02)}80%{transform:rotate(4deg) scale(1.01)}}
</style>
</head>
<body>
<main class="app">
<h1>Magic Prediction Ball</h1><p class="hint">Ask a question. Tap the ball for an answer.</p>
<div class="ball" id="ball" role="button" tabindex="0" aria-label="Tap the prediction ball"><div class="window"><div class="answer" id="answer">TAP ME</div></div></div>
<button id="ask">Ask the Ball</button>
<div class="history" id="history"></div>
</main>
<script>
const answers=['YES — definitely','It is certain','Most likely','The signs say YES','Absolutely','Looks promising','Ask again','Try again later','Maybe','The answer is unclear','Not today','Don’t count on it','Very unlikely','NO — not this time','Something unexpected is coming','Trust your instincts','The outlook is positive','Patience will pay off','Better wait and see','You already know the answer'];
const ball=document.getElementById('ball'),answer=document.getElementById('answer'),history=document.getElementById('history');
function ask(){ball.classList.remove('shake');void ball.offsetWidth;ball.classList.add('shake');answer.textContent='…';setTimeout(()=>{const a=answers[Math.floor(Math.random()*answers.length)];answer.textContent=a;history.textContent='Last answer: '+a},650)}
ball.addEventListener('click',ask);ball.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ask()}});document.getElementById('ask').addEventListener('click',ask);
</script>
</body></html>
